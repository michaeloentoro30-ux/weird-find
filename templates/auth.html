{% extends "base.html" %}{% block content %}
<div class="auth paper"><h1>{{'Create your account' if mode=='register' else 'Welcome back'}}</h1>
<form method="post">
<label>Username<input name="username" required autocomplete="username"></label>
<label>Password<input type="password" name="password" required autocomplete="{{'new-password' if mode=='register' else 'current-password'}}"></label>
{% if mode=='register' %}<label>Confirm password<input type="password" name="confirm" required></label>{% endif %}
<button class="button">{{'CREATE ACCOUNT' if mode=='register' else 'LOGIN'}}</button>
</form>
<p>{% if mode=='register' %}Already have an account? <a href="{{url_for('login')}}">Login</a>{% else %}New here? <a href="{{url_for('register')}}">Create an account</a>{% endif %}</p></div>
{% endblock %}
