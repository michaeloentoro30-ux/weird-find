{% extends "base.html" %}{% block content %}<section class="shop"><div class="eyebrow">THE STRANGE LITTLE SHOP</div><h1>Redeem your points</h1><div class="shop-grid">{% for key,item in shop.items() %}<div class="shop-item paper"><div class="shop-icon">{{item.emoji}}</div><h2>{{item.name}}</h2><div class="cost">{{item.cost}} ★</div><form method="post" action="{{url_for('buy',item=key)}}"><button class="button">REDEEM</button></form></div>{% endfor %}</div></section>{% endblock %}
