{% extends "base.html" %}{% block content %}<div class="profile-head paper"><span class="eyebrow">COLLECTOR</span><h1>{{user['username']}}</h1><div class="big-points">{{user['points']}} <small>POINTS</small></div></div><section class="paper"><h2>Point history</h2>{% for t in tx %}<div class="row"><span>{{t['reason']}}</span><b class="{{'negative' if t['amount']<0}}">{{'+' if t['amount']>0 else ''}}{{t['amount']}}</b><small>{{t['created_at']}}</small></div>{% else %}<p class="muted">No transactions yet.</p>{% endfor %}</section>{% endblock %}
